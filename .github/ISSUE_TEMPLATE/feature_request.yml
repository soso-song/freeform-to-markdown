name: Feature request
description: Propose an exporter, archive, or workflow improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What archival problem should the project solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe user-visible behavior and how it can be verified.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI and workflow
        - Freeform schema adapter
        - Extraction and OCR
        - Spatial Scenes and relationships
        - Archive schema and Markdown
        - Verification and privacy
        - Agent Skill
        - Documentation
    validations:
      required: true
  - type: textarea
    id: alternative
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This request contains no real Freeform data or personal information.
          required: true
