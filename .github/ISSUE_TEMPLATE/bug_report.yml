name: Bug report
description: Report reproducible incorrect behavior using synthetic data only.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Never attach a real Freeform database, board, asset,
        screenshot, archive, private URL, or personal information. Security and privacy issues
        belong in GitHub private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `freeform-to-markdown --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: macOS and Python versions, without device names or local paths.
      placeholder: "macOS 15.x, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe observed and expected behavior without board content.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide minimal steps and a fixture authored from scratch, if needed.
      placeholder: |
        1. Create a synthetic board fixture containing...
        2. Run `ff2md archive ...`
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Paste only relevant output after removing paths, titles, identifiers, and content.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included or linked to real Freeform data or personal information.
          required: true
        - label: This report is not a security or privacy vulnerability.
          required: true
        - label: I searched existing issues and reproduced this on the latest version.
          required: true
