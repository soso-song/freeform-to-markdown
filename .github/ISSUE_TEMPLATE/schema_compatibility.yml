name: Schema compatibility report
description: Request support for a Freeform schema fingerprint using sanitized diagnostics.
title: "[Schema]: "
labels:
  - compatibility
body:
  - type: markdown
    attributes:
      value: |
        Run `freeform-to-markdown doctor`, then remove every local path, board title, identifier,
        object value, and username before sharing output. Do not upload a real database or asset.
  - type: input
    id: version
    attributes:
      label: Tool version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS and Python versions
      placeholder: "macOS 15.x, Python 3.12"
    validations:
      required: true
  - type: input
    id: user_version
    attributes:
      label: SQLite user_version
      description: The numeric schema version reported by `doctor`.
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Sanitized schema fingerprint
      description: Paste only the fingerprint emitted specifically for public reporting.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Sanitized capability report
      description: Remove all local paths, titles, identifiers, counts tied to a private board, and content.
      render: text
    validations:
      required: true
  - type: textarea
    id: synthetic_fixture
    attributes:
      label: Synthetic fixture plan
      description: Explain how the behavior can be reproduced with data created from scratch.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not derive the attached fixture or output from a real board.
          required: true
        - label: I have not included database files, asset files, screenshots, private URLs, or personal information.
          required: true
