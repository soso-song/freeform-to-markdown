name: Dependabot safe auto-merge

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  safe-update:
    name: Approve safe dependency update
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'soso-song/freeform-to-markdown'
    runs-on: ubuntu-latest
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve safe patch or minor update
        if: >-
          (steps.metadata.outputs.package-ecosystem == 'github-actions' ||
          steps.metadata.outputs.dependency-type == 'direct:development') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # A merge commit keeps the default-branch workflow run attributed to the
      # repository maintainer. GitHub documents that a Dependabot-authored
      # squash commit can leave CodeQL with a read-only token on the push run.
      - name: Enable merge-commit auto-merge after required checks pass
        if: >-
          (steps.metadata.outputs.package-ecosystem == 'github-actions' ||
          steps.metadata.outputs.dependency-type == 'direct:development') &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
